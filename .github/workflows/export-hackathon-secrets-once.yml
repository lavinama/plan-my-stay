# Throwaway: prints two hackathon secrets encrypted to a public key whose private key
# never leaves the owner's laptop. The branch, this file and the run are deleted right after.
name: export-hackathon-secrets-once
on:
  push:
    branches: [ci/export-hackathon-secrets-once]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: hackathon
    steps:
      - name: Encrypt the secrets to the owner's public key
        env:
          COGNEE_API_KEY: ${{ secrets.COGNEE_API_KEY }}
          SIE_API_KEY: ${{ secrets.SIE_API_KEY }}
        run: |
          set -euo pipefail
          : "${COGNEE_API_KEY:?COGNEE_API_KEY is empty}"
          : "${SIE_API_KEY:?SIE_API_KEY is empty}"
          cat > pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAjstWmrqqbJM4XNpvO1m7
          zrqHJtdYmKFZWFgIR127LSQ5jJ9yF06j2FnPHUS1YVJ8M3LEyBJBbOb/fdzm8jbo
          M53yqqCCiZ6VyzjzUbjFT7QKrWIbUORBzJHx+E34c/pfC1X3tA5OLqs1yFl7rOb+
          rJ/rmeBFUr3xThRmKbOCQA+dwmwR1jVsYaidOq9iz2P1F+nBweAGhU8LEojoLo6i
          OHQ5IstPFy8BpCzSuOJnmO4OFWU3oR1mBiglbsVCwRoUSw90UtWqHYzmba22gc1A
          T1vy1ilAT2/vD8idOLYcdtQy3IazhsKKnXZxgKPoQvq6v65Htnt/94t1mOa+x9VD
          naeCXqijXN00kuY2SG6K/yYlJJcUzipLqEIWu065q29Tiyskk9T9zfFSYsuaQRTa
          EGaHdjMTCJ34FAfdMBEFsRRxIi6muHw48AyDiAIuENRT7N3jARsJpIZgsXYtj0YJ
          9t1TLiE6wCvKZAFHzfDeqa0M40bsVAOpaLPEMTg6JlNp6/VjATmKEqAOwJzDB0dH
          UZdVN0EJ6+z6l7l4FhRnkGaJ9lNecKb9Oe/2uh+AzU6UEdtki4AFUT2rLy7JDUCx
          daEUYHCMhpDlnzuvn7bneKIhbL/0K5POk+RwAtmaoYjrKtDMnIQ2EX1UzFmnRXn/
          RKKtP3KsOFEeOTUh3L1eg80CAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          enc() {
            printf '%s' "$1" | openssl pkeyutl -encrypt -pubin -inkey pub.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
              | base64 -w0
          }
          echo "ENC_COGNEE_API_KEY=$(enc "$COGNEE_API_KEY")"
          echo "ENC_SIE_API_KEY=$(enc "$SIE_API_KEY")"
