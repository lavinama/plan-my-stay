[project]
name = "plan-my-stay"
version = "0.1.0"
description = "A team of agents that plans a work trip around your meetings and remembers how you like to travel."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
band = ["band-sdk[langgraph]>=9.2,<10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/plan_my_stay"]
